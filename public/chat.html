<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEOS Sovereign Chat</title>
<style>
  body{font-family:system-ui;background:#0a0a0a;color:#e5e5e5;max-width:720px;margin:0 auto;padding:24px}
  #log{display:flex;flex-direction:column;gap:12px;min-height:60vh;margin:20px 0}
  .msg{padding:12px 16px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-break:break-word;line-height:1.6}
  .user{background:#1e40af;align-self:flex-end}
  .bot{background:#1a1a1a;border:1px solid #2a2a2a;align-self:flex-start}
  .error{background:#3a1212;border:1px solid #5a2020;color:#ffb4b4}
  #form{display:flex;gap:8px}
  input{flex:1;padding:12px;border-radius:8px;border:1px solid #333;background:#111;color:#fff}
  button{padding:12px 20px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:700;cursor:pointer}
  small{color:#666}
</style>
</head>
<body>
<h1>TEOS — النواة السيادية</h1>
<small>متصل بـ qwen المحلي عبر sovereignKernel — لا ادعاءات محفظة</small>
<div id="log"></div>
<form id="form">
  <input id="q" placeholder="اكتب سؤالك هنا..." autocomplete="off" required />
  <button type="submit">إرسال</button>
</form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),form=document.getElementById('form');
function add(role,text){
  const d=document.createElement('div');
  d.className='msg '+(role==='user'?'user':role==='error'?'error':'bot');
  d.dir='auto';
  d.textContent=text;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
  return d;
}
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const txt=q.value.trim();
  if(!txt)return;
  add('user',txt);
  q.value='';
  const pending=add('bot','... جاري التفكير محليا');
  try{
    const res=await fetch('/api/sovereign-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:txt})});
    const data=await res.json();
    if(!res.ok){
      if(data.error==='POLICY_BLOCKED'||res.status===403){
        pending.textContent='تم الحظر بواسطة سياسة النواة: '+(data.message||data.error||'');
        pending.className='msg error';
      }else{throw new Error(data.message||data.error||'HTTP '+res.status);}
      return;
    }
    pending.textContent=data.response||'لا يوجد رد';
  }catch(err){pending.textContent='Error: '+err.message;pending.className='msg error';}
});
</script>
</body>
</html>
